# SD Nova P0 verification on a clean checkout. Read-only: no release, no auth,
# no stored credentials; actions are pinned to full commit SHAs.
#
# Order matters on a clean checkout: `npm run build` (JS + CSS) and
# `npm run smoke:pack` produce gitignored outputs that later steps read.
# test:unit includes test/package/** (dist.test.ts needs dist/styles.css;
# bundle.test.ts needs fixtures/bundle-isolation/dist from smoke:pack), and
# test:e2e / check:bundle use the packed fixtures.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: P0 gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
      - name: Install from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck consumer fixtures (TypeScript 6 and 5.7)
        run: npm run typecheck:fixtures
      - name: Build (JS + CSS)
        run: npm run build
      - name: Check CSS
        run: npm run check:css
      - name: Check package (manifest, dist, publint, attw)
        run: npm run check:package
      - name: Pack tarball and build consumer fixtures
        run: npm run smoke:pack
      - name: Unit tests
        run: npm run test:unit
      - name: SSR tests
        run: npm run test:ssr
      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Browser tests (Chromium, Firefox, WebKit)
        run: npm run test:browser
      - name: Production E2E (Vite CSR, Next SSR)
        run: npm run test:e2e
      - name: Bundle isolation
        run: npm run check:bundle
      - name: Provenance
        run: npm run check:provenance
      - name: Typecheck showcase
        run: npm run typecheck:showcase
      - name: Build showcase
        run: npm run build:showcase
      - name: Check public artifact and negative cases
        run: npm run check:showcase
      - name: Showcase production browser checks
        run: npm run test:showcase
